name: Instalador Seguranca Windows
on:
  push:
    branches: [main]
    paths:
      - 'installer/**'
      - 'seguranca_desktop.py'
      - 'rh_riscos*.py'
      - 'rh_dna_local.py'
      - 'rh_dna_offline.py'
      - '.github/workflows/instalador-seguranca.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r installer/requirements-windows.txt
      - name: Validar fontes e testes
        run: |
          python -m compileall -q seguranca_desktop.py rh_dna_local.py rh_dna_offline.py rh_riscos.py rh_riscos_local.py
          python installer/test_desktop.py
      - name: Gerar aplicativo sem Python externo
        shell: pwsh
        run: |
          $args = @('--noconfirm','--clean','--onedir','--windowed','--name','10SulSeguranca','--collect-all','streamlit','--collect-all','altair','--collect-all','pyarrow','--collect-all','reportlab','--hidden-import','openpyxl','--hidden-import','pandas','--hidden-import','PIL','--hidden-import','requests')
          $files = @('seguranca_desktop.py','rh_dna_local.py','rh_dna_offline.py','rh_riscos.py','rh_riscos_local.py','rh_riscos_monitor.py','rh_riscos_export.py','rh_riscos_excel.py','rh_riscos_offline_pack.py','seguranca_offline.py')
          foreach ($file in $files) { $args += @('--add-data',"$file;.") }
          $args += @('--add-data','assets;assets','installer/launcher.py')
          python -m PyInstaller @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Gerar instalador
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { choco install innosetup --yes --no-progress }
          & $iscc installer/Seguranca.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Testar instalação e abertura no Windows
        shell: pwsh
        run: |
          $setup = (Get-ChildItem installer/output/*.exe | Select-Object -First 1).FullName
          $destination = Join-Path $env:RUNNER_TEMP 'SegurancaInstalada'
          $install = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$destination") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Instalador retornou $($install.ExitCode)" }
          $app = Start-Process (Join-Path $destination '10SulSeguranca.exe') -PassThru
          $ready = $false
          for ($i=0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-WebRequest 'http://127.0.0.1:18517/_stcore/health'; if ($r.StatusCode -eq 200) { $ready=$true; break } } catch {}
            if ($app.HasExited) { break }
          }
          if (!$ready) { throw 'O aplicativo instalado não abriu o servidor local.' }
          Invoke-WebRequest 'http://127.0.0.1:18517' | Select-Object StatusCode
          taskkill /PID $app.Id /T /F
      - uses: actions/upload-artifact@v4
        with:
          name: Instalador_10Sul_Seguranca_Windows
          path: installer/output/*.exe
          if-no-files-found: error
          retention-days: 30
